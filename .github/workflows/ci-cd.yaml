name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  GCP_REGION: us-central1
  ARTIFACT_REPO: graphceylon
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ============================================================
  # Testing — Python Services
  # ============================================================
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - kg_service
          - language_service
          - recommender_service
          - orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        working-directory: ./services/${{ matrix.service }}
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio httpx
      - name: Run tests
        working-directory: ./services/${{ matrix.service }}
        run: pytest --tb=short -q

  # ============================================================
  # Testing — Node.js Services
  # ============================================================
  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth_service
          - user_service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        working-directory: ./services/${{ matrix.service }}
        run: npm ci
      - name: Build TypeScript
        working-directory: ./services/${{ matrix.service }}
        run: npm run build
      - name: Run tests
        working-directory: ./services/${{ matrix.service }}
        run: npm test --if-present

  # ============================================================
  # Linting
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linting tools
        run: pip install flake8 black mypy
      - name: Run flake8
        run: flake8 services/ --max-line-length=120 --exclude=__pycache__,node_modules,dist
      - name: Run black
        run: black --check services/ --exclude='node_modules|dist'
      - name: Run mypy
        run: |
          mypy services/language_service/src --ignore-missing-imports || true
          mypy services/kg_service/src --ignore-missing-imports || true
          mypy services/recommender_service/src --ignore-missing-imports || true
          mypy services/orchestrator/src --ignore-missing-imports || true

  # ============================================================
  # Build & Push Docker Images
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH=${GITHUB_REF##*/}
          echo "IMAGE_TAG=${SHORT_SHA}" >> $GITHUB_ENV
          echo "BRANCH_TAG=${BRANCH}" >> $GITHUB_ENV
          echo "REGISTRY=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth_service
          file: ./docker/auth_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/auth-service:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/auth-service:${{ env.BRANCH_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/user_service
          file: ./docker/user_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/user-service:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/user-service:${{ env.BRANCH_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push language-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/language_service
          file: ./docker/language_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/language-service:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/language-service:${{ env.BRANCH_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push kg-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/kg_service
          file: ./docker/kg_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/kg-service:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/kg-service:${{ env.BRANCH_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push recommender-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/recommender_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/recommender-service:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/recommender-service:${{ env.BRANCH_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push orchestrator
        uses: docker/build-push-action@v5
        with:
          context: ./services/orchestrator
          file: ./docker/orchestrator/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/orchestrator:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/orchestrator:${{ env.BRANCH_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

