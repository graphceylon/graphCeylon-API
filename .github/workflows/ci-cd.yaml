name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-language-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        working-directory: ./services/language_service
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio
      - name: Run tests
        working-directory: ./services/language_service
        run: pytest

  test-kg-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        working-directory: ./services/kg_service
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio
      - name: Run tests
        working-directory: ./services/kg_service
        run: pytest

  test-recommender-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        working-directory: ./services/recommender_service
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio
      - name: Run tests
        working-directory: ./services/recommender_service
        run: pytest

  test-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        working-directory: ./services/orchestrator
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio
      - name: Run tests
        working-directory: ./services/orchestrator
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install linting tools
        run: |
          uv pip install --system flake8 black mypy
      - name: Run flake8
        run: flake8 services/
      - name: Run black
        run: black --check services/
      - name: Run mypy
        run: mypy services/ --ignore-missing-imports

  docker-build:
    runs-on: ubuntu-latest
    needs:
      [
        test-language-service,
        test-kg-service,
        test-recommender-service,
        test-orchestrator,
      ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker images
        run: |
          docker-compose -f infra/docker-compose.yaml build
