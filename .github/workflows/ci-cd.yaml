name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  GCP_REGION: us-central1
  ARTIFACT_REPO: graphceylon
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ============================================================
  # Detect Changes
  # ============================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth_service:
              - 'services/auth_service/**'
              - 'docker/auth_service/**'
              - '.github/workflows/ci-cd.yaml'
            user_service:
              - 'services/user_service/**'
              - 'docker/user_service/**'
              - '.github/workflows/ci-cd.yaml'
            language_service:
              - 'services/language_service/**'
              - 'docker/language_service/**'
              - '.github/workflows/ci-cd.yaml'
            kg_service:
              - 'services/kg_service/**'
              - 'docker/kg_service/**'
              - '.github/workflows/ci-cd.yaml'
            recommender_service:
              - 'services/recommender_service/**'
              - 'docker/recommender_service/**'
              - '.github/workflows/ci-cd.yaml'
            orchestrator:
              - 'services/orchestrator/**'
              - 'docker/orchestrator/**'
              - '.github/workflows/ci-cd.yaml'


  # ============================================================
  # Build & Push Docker Images
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.services != '[]' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    # Only build/push images for changed services
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH=${GITHUB_REF##*/}
          echo "IMAGE_TAG=${SHORT_SHA}" >> $GITHUB_ENV
          echo "BRANCH_TAG=${BRANCH}" >> $GITHUB_ENV
          echo "REGISTRY=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'recommender_service' && '.' || format('./services/{0}', matrix.service) }}
          file: ./docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.BRANCH_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

